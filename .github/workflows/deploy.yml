name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './rest-api/package-lock.json'

      - name: Install dependencies
        run: |
          cd rest-api
          npm ci

      - name: Run build (if any)
        run: |
          cd rest-api
          # npm run build --if-present

      - name: Build Docker Image (Dry Run)
        run: |
          docker build -t sahaapp-api:test ./rest-api
